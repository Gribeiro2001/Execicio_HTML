<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Validação de Números com Animação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Comparador de Números</h2>
        <form id="form-numeros">
            <label for="campoA">Campo A:</label>
            <input type="number" id="campoA" required>

            <label for="campoB">Campo B:</label>
            <input type="number" id="campoB" required>

            <button type="submit">Comparar</button>
        </form>

        <div id="mensagem"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
